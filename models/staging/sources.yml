version: 2

sources:
  - name: raw
    database: RETAIL_BI
    schema: RAW
    description: "Raw ingested retail data from POS / Shopify-style source system"
    tables:
      - name: raw_orders
        description: "One row per order"
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: order_date
            tests: [not_null]
          - name: status
            tests:
              - accepted_values:
                  values: ['completed','cancelled','returned']

      - name: raw_order_items
        description: "One row per line item within an order"
        columns:
          - name: item_id
            tests: [unique, not_null]
          - name: order_id
            tests: [not_null]

      - name: raw_customers
        columns:
          - name: customer_id
            tests: [unique, not_null]

      - name: raw_products
        columns:
          - name: product_id
            tests: [unique, not_null]
